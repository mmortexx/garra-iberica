# Comprueba la web en cada push y pull request. GitHub Pages publica la rama aunque esto falle:
# si sale en rojo, hay que arreglarlo y volver a subir.
name: Comprobar la web

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web, datos y navegador
    runs-on: ubuntu-latest
    # La batería del navegador ya tarda unos 25 min en GitHub; con margen para que crezca.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Los apodos van en su propio trabajo, con el secreto.
      - name: Comprobar HTML, enlaces, versiones y datos del clan
        run: python herramientas/comprobar.py --sin-apodos
      - name: Prueba de la cuenta atrás
        run: node herramientas/prueba_caceria.js
      - name: Prueba de los recortes de la galería
        run: python herramientas/prueba_galeria.py
      - name: Prueba de las cifras del clan
        run: python herramientas/prueba_cifras.py
      - name: Prueba de las batallas
        run: python herramientas/prueba_batallas.py
      - name: Prueba de la publicación automática de los datos
        run: python herramientas/prueba_publicar.py
      - name: Prueba de los borradores
        run: python herramientas/prueba_borradores.py
      - name: Prueba de lo que debe parar la comprobación
        run: python herramientas/prueba_comprobar.py
      - name: Prueba de la ruta de logros
        run: python herramientas/prueba_logros.py
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.60.0 axe-core@4.14.0
          npx playwright install --with-deps chromium
      - name: Prueba en navegador
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory docs > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
          node herramientas/prueba_navegador.js

  cuentas:
    name: Servicio de cuentas y recorrido en navegador
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar el servicio
        run: npm ci
        working-directory: servicio
      - name: Pruebas del servicio, ataques incluidos
        run: npm test
        working-directory: servicio
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.60.0
          npx playwright install --with-deps chromium
      - name: Recorrido en navegador
        run: npm run recorrido
        working-directory: servicio
      - name: Quitar cada guarda del servicio y exigir que una prueba falle
        run: npm run mutaciones
        working-directory: servicio
      - name: Quitar cada guarda de la página y exigir que el recorrido falle
        run: npm run mutaciones:pagina
        working-directory: servicio

  apodos:
    name: Sin apodos de miembros
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar apodos de miembros en la web
        env:
          VIGILAR_APODOS: ${{ secrets.VIGILAR_APODOS }}
        run: |
          if [ -z "$VIGILAR_APODOS" ]; then
            echo "::error::Falta el secreto VIGILAR_APODOS (los apodos de herramientas/vigilar.local.txt). Créalo con: gh secret set VIGILAR_APODOS < herramientas/vigilar.local.txt"
            exit 1
          fi
          python herramientas/comprobar.py
